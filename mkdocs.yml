site_name: NHN Cloud 사용자 가이드
site_description: NHN Cloud 서비스 공식 사용자 가이드
site_url: https://nhncloud.duckdns.org/
site_author: NHN Cloud Technical Training

repo_url: https://github.com/mslovehacker/NHN-Docs
repo_name: mslovehacker/NHN-Docs
edit_uri: edit/poc-mkdocs-material/docs/

copyright: Copyright &copy; NHN Cloud Corp. All rights reserved.

theme:
  name: material
  custom_dir: overrides
  language: ko
  font: false
  favicon: assets/images/favicon-32x32.png

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
    - content.tabs.link
    - toc.follow

  palette:
    # Light 모드 (기본)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: 다크 모드로 전환
    # Dark 모드
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: 라이트 모드로 전환

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
  - search:
      lang:
        - ko
        - en
        - ja
  - i18n:
      docs_structure: folder
      languages:
        - locale: ko
          name: 한국어
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            홈: Home
            빠른 시작: Quickstart
            개요: Overview
            컴퓨팅: Compute
            인스턴스: Instance
            컨테이너: Container
            NKS: NKS
            사용 가이드: User Guide
            API 가이드: API Guide
            백업 가이드: Backup Guide
            Istio 가이드: Istio Guide
            버전 가이드: Version Guide
            문제 해결 가이드: Troubleshooting Guide
            릴리스 노트: Release Notes
        - locale: ja
          name: 日本語
          build: true
          nav_translations:
            홈: ホーム
            빠른 시작: クイックスタート
            개요: 概要
            컴퓨팅: コンピュート
            인스턴스: インスタンス
            컨테이너: コンテナ
            NKS: NKS
            사용 가이드: ユーザーガイド
            API 가이드: APIガイド
            백업 가이드: バックアップガイド
            Istio 가이드: Istioガイド
            버전 가이드: バージョンガイド
            문제 해결 가이드: トラブルシューティングガイド
            릴리스 노트: リリースノート

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: 이 섹션으로 직접 이동
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - 홈: index.md
  - 빠른 시작:
      - 개요: quickstarts/overview.md
  - 컴퓨팅:
      - 인스턴스: compute/instance.md
  - 컨테이너:
      - NKS:
          - 개요: container/nks/overview.md
          - 사용 가이드: container/nks/user-guide.md
          - API 가이드: container/nks/public-api.md
          - 백업 가이드: container/nks/backup-guide.md
          - Istio 가이드: container/nks/istio-guide.md
          - 버전 가이드: container/nks/version-guide.md
          - 문제 해결 가이드: container/nks/troubleshooting-guide.md
          - 릴리스 노트: container/nks/release-notes.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mslovehacker/NHN-Docs
      name: NHN Cloud Docs GitHub
  alternate:
    - name: 한국어
      link: /
      lang: ko
    - name: English
      link: /en/
      lang: en
    - name: 日本語
      link: /ja/
      lang: ja
  homepage: https://nhncloud.duckdns.org/

extra_css:
  # - stylesheets/toast-icon/ti-icon-style.css  # 폰트 아이콘 (정식 NHN BI 수령 후 활성화)
  - stylesheets/nhncloud-theme.css
