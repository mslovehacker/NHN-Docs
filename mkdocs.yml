        - Server Dashboard: database/rds/server-dashboard.md
        - 릴리스 노트: database/rds/release-notes.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mslovehacker/NHN-Docs
      name: NHN Cloud Docs GitHub
  alternate:
    - name: 한국어
      link: /
      lang: ko
    - name: English
      link: /en/
      lang: en
    - name: 日本語
      link: /ja/
