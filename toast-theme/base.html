<!DOCTYPE html>
<html lang="{{ config.extra.language }}">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#ffffff">
        <meta name="google-site-verification" content="-GjgcYdhJPn5yhb0wIFXS6-82y-S9jLRyWHIrKDMOoc" />
        <meta name="naver-site-verification" content="be76814dd0166b957001ef0edaebeadd35de85b6" />
        <title>{% if page_title %}{{ page_title }} - {% endif %}{{ site_name }}</title>
        {% if page_description %}<meta name="description" content="{{ page_description }}">{% endif %}
        {% if site_author %}<meta name="author" content="{{ site_author }}">{% endif %}
        {% if canonical_url %}<link rel="canonical" href="{{ canonical_url }}">{% endif %}

        <link rel="apple-touch-icon" sizes="180x180" href="{{ base_url }}/img/favicons/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="{{ base_url }}/img/favicons/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="{{ base_url }}/img/favicons/favicon-16x16.png">
        <link rel="manifest" href="{{ base_url }}/img/favicons/manifest.json">
        <link rel="mask-icon" href="{{ base_url }}/img/favicons/safari-pinned-tab.svg" color="#4b96e6">

        <link rel="stylesheet" href="{{ base_url }}/css/bootstrap4-custom.css">
        <link rel="stylesheet" href="{{ base_url }}/css/default.css">
        <link rel="stylesheet" media="none" onload="if(media!='all')media='all'" href="https://static.toastoven.net/toast/resources/css/toast-gnb.css">
        <link rel="stylesheet" href="{{ base_url }}/css/base.css">
        <link rel="stylesheet" media="none" onload="if(media!='all')media='all'" href="{{ base_url }}/css/footer.css">
        <link rel="stylesheet" href="{{ base_url }}/css/navbar-top.css">
        <script src="https://code.jquery.com/jquery-3.2.1.min.js" integrity="sha256-hwg4gsxgFZhOsEEamdOYGBf13FyQuiTwlAQgxVSNgt4=" crossorigin="anonymous"></script>
    </head>
    <body data-spy="scroll" data-target="#list__rnb" data-offset="110">
        <div id="toast-gnb-header" class="fixed-top scrolled scrolled-fix header">
        </div>
		<div class="page__wrapper">
            {% include "nav-lnb.html" %}
			<div class="page__side-divider"></div>
			<section class="page__content-wrapper">
				<div class="content-container">
					{% include "content.html" %}
				</div>
			</section>
			{% include "navbar-right.html" %}
		</div>
        {% include "footer.html" %}
	    {%- for path in extra_javascript %}
        <script src="{{ path }}"></script>
        {%- endfor %}
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.3/umd/popper.min.js" integrity="sha384-vFJXuSJphROIrBnz7yo7oB41mKfc8JzQZiCq4NCceLEaO4IHwicKwpJf9c9IpFgh" crossorigin="anonymous"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0-beta.2/js/bootstrap.min.js" integrity="sha384-alpBpkh1PFOepccYVYDB4do5UnbKysX5WZXm3XxPqe5iKTfUKjNkCk9SaVuEZflJ" crossorigin="anonymous"></script>
        <script>
            var base_url = '{{ base_url }}';
            var gnb;
        </script>
        <script src="{{ base_url }}/js/sticky-kit.min.js"></script>
        <script defer src="{{ base_url }}/js/highlight.pack.js"></script>
        <script async src="{{ base_url }}/js/base.js"></script>
        <script defer src="{{ base_url }}/js/header.js"></script>
        <script defer src="{{ base_url }}/js/footer.js"></script>
        <!-- Google tag (gtag.js) -->
        <script async src="https://www.googletagmanager.com/gtag/js?id=G-0S7XY7DVK9"></script>
        <script>
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());

          gtag('config', 'G-0S7XY7DVK9');
        </script>
    </body>
</html>
