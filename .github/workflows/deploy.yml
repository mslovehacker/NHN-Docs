name: Build and Deploy NHN Cloud Docs

on:
  push:
    branches:
      - poc-mkdocs-material
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build with mkdocs and deploy via SSH
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build static site
        run: mkdocs build --strict --verbose

      - name: Verify build output
        run: |
          if [ ! -f ./site/index.html ]; then
            echo "Default (ko) build output missing"
            exit 1
          fi
          if [ ! -d ./site/en ]; then
            echo "English build output missing"
            exit 1
          fi
          if [ ! -d ./site/ja ]; then
            echo "Japanese build output missing"
            exit 1
          fi
          FILE_COUNT=$(find ./site -type f | wc -l)
          echo "Build verified: $FILE_COUNT files generated"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: ./site
          retention-days: 14

      - name: Setup SSH key (robust)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # 개인키 안전하게 작성 (printf 로 줄바꿈 보존)
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          # 키 형식 검증
          echo "=== Key file structure ==="
          head -1 ~/.ssh/id_ed25519
          tail -1 ~/.ssh/id_ed25519
          echo "Total lines: $(wc -l < ~/.ssh/id_ed25519)"

          # 키 유효성 검증 (실패 시 즉시 멈춤)
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null && echo "✅ Private key is valid"

          # known_hosts 등록 (재시도 + verbose)
          echo ""
          echo "=== ssh-keyscan ${SERVER_HOST}:${SERVER_PORT} ==="
          for i in 1 2 3; do
            if ssh-keyscan -p "$SERVER_PORT" -T 10 "$SERVER_HOST" >> ~/.ssh/known_hosts 2>&1; then
              echo "✅ ssh-keyscan succeeded on attempt $i"
              break
            else
              echo "⏳ ssh-keyscan attempt $i failed, retrying..."
              sleep 3
            fi
          done

          # known_hosts 결과 확인
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "❌ known_hosts is empty after retries"
            echo "Trying without -T option as fallback..."
            ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts 2>&1 || true
          fi

          echo ""
          echo "=== known_hosts content (sanitized) ==="
          awk '{print $1, $2, "..."}' ~/.ssh/known_hosts

          # SSH 접속 사전 테스트
          echo ""
          echo "=== SSH connection test ==="
          ssh -i ~/.ssh/id_ed25519 \
              -p "$SERVER_PORT" \
              -o BatchMode=yes \
              -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=accept-new \
              "${{ secrets.SERVER_USER }}@$SERVER_HOST" \
              "echo SSH-OK; whoami; hostname"

      - name: Backup current site on server
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SERVER_PORT }} \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "sudo rsync -a --delete /var/www/docs/ /var/www/docs.backup/ 2>/dev/null || true"

      - name: Deploy via rsync (with sudo)
        run: |
          rsync -avz --delete \
            --rsync-path="sudo rsync" \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SERVER_PORT }}" \
            ./site/ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/var/www/docs/

      - name: Reload nginx
        run: |
          ssh -i ~/.ssh/id_ed25519 -p ${{ secrets.SERVER_PORT }} \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "sudo systemctl reload nginx"

      - name: Verify deployment
        run: |
          sleep 3
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://${{ secrets.SERVER_HOST }}/ || echo "000")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Deployment verification failed: HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Deployment verified: HTTP $HTTP_STATUS"
